<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacitaciones ALR - Portal Web Privado</title>
  
  <!-- Icono oficial del Portal -->
  <link rel="icon" type="image/jpeg" href="Logoalr.jpg">
  <link rel="apple-touch-icon" href="Logoalr.jpg">

  <!-- Fuentes formales: Baskerville Libre y MonteCarlo -->
  <link href="https://fonts.googleapis.com/css2?family=Baskerville+Libre:ital,wght@0,400;0,700;1,400&family=MonteCarlo&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Librería para exportar a PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden" onclick="handleOutsideClick(event)">

  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const SUPABASE_URL = 'https://bvnsepupghgluqnhrdgl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-B-Lck4vqjF0eLf0UlXJzQ_jOhPg_XH';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let state = {
      user: null,
      activeTab: 'muro',
      menuOpen: false,
      expandedStudentEmail: null,
      whitelist: [],
      posts: [],
      modules: [],
      presentations: [],
      tasks: [],
      questions: []
    };

    let loginErrorMsg = '';

    async function loadData() {
      try {
        const { data: usersData } = await _supabase.from('usuarios').select('*');
        if (usersData) state.whitelist = usersData;

        const { data: postsData } = await _supabase.from('posts').select('*').order('id', { ascending: false });
        if (postsData) state.posts = postsData;

        const { data: modData } = await _supabase.from('modules').select('*').order('id', { ascending: false });
        if (modData) state.modules = modData;

        const { data: pptData } = await _supabase.from('presentations').select('*').order('id', { ascending: false });
        if (pptData) state.presentations = pptData;

        const { data: taskData } = await _supabase.from('tasks').select('*').order('id', { ascending: false });
        if (taskData) state.tasks = taskData;

        const { data: qData } = await _supabase.from('questions').select('*').order('id', { ascending: false });
        if (qData) state.questions = qData;
      } catch (err) {
        console.error('Error al conectar con Supabase:', err);
      }
      render();
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const cedula = document.getElementById('cedulaInput').value.trim();

      const { data, error } = await _supabase.from('usuarios').select('*');

      if (error || !data) {
        loginErrorMsg = 'Error al conectar con la base de datos.';
        render();
        return;
      }

      const matchedUser = data.find(u => 
        u.email && u.email.trim().toLowerCase() === email && 
        u.cedula && u.cedula.trim() === cedula
      );

      if (matchedUser) {
        state.user = matchedUser;
        state.activeTab = 'muro';
        state.menuOpen = false;
        loginErrorMsg = '';
        loadData();
      } else {
        loginErrorMsg = 'Correo o número de cédula no autorizado o incorrecto.';
        render();
      }
    }

    function logout() {
      state.user = null;
      render();
    }

    function setTab(tab) {
      state.activeTab = tab;
      state.menuOpen = false;
      loadData();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMenu(event) {
      if (event) event.stopPropagation();
      state.menuOpen = !state.menuOpen;
      render();
    }

    function handleOutsideClick(event) {
      if (state.menuOpen) {
        const menuEl = document.getElementById('dropdownMenu');
        const btnEl = document.getElementById('menuBtn');
        if (menuEl && !menuEl.contains(event.target) && btnEl && !btnEl.contains(event.target)) {
          state.menuOpen = false;
          render();
        }
      }
    }

    function toggleStudentExpand(email) {
      if (state.expandedStudentEmail === email) {
        state.expandedStudentEmail = null;
      } else {
        state.expandedStudentEmail = email;
      }
      render();
    }

    async function addStudent(event) {
      event.preventDefault();
      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim().toLowerCase();
      const cedula = document.getElementById('studentCedula').value.trim();
      const grupo = document.getElementById('studentGroup').value.trim();

      if (!name || !email || !cedula || !grupo) return alert('Completa todos los campos, incluyendo el grupo.');

      const { error } = await _supabase.from('usuarios').insert([{ name, email, cedula, grupo, role: 'student' }]);
      if (error) {
        alert('Error al registrar estudiante.');
      } else {
        alert(`¡Estudiante ${name} registrado con éxito en el ${grupo}!`);
        loadData();
      }
    }

    async function deleteStudent(email) {
      if (confirm('¿Deseas revocar el acceso a este estudiante?')) {
        const { error } = await _supabase.from('usuarios').delete().eq('email', email);
        if (!error) loadData();
      }
    }

    async function addPost(event) {
      event.preventDefault();
      const text = document.getElementById('newPostText').value.trim();
      if (!text) return;
      const { error } = await _supabase.from('posts').insert([{
        author: state.user.name + (state.user.role === 'admin' ? ' (Capacitador)' : ''),
        role: state.user.role,
        content: text,
        timestamp: 'Justo ahora',
        likes: 0
      }]);
      if (!error) { document.getElementById('newPostText').value = ''; loadData(); }
    }

    async function deletePost(id) {
      if (confirm('¿Eliminar publicación?')) {
        const { error } = await _supabase.from('posts').delete().eq('id', id);
        if (!error) loadData();
      }
    }

    async function likePost(id, currentLikes) {
      const { error } = await _supabase.from('posts').update({ likes: currentLikes + 1 }).eq('id', id);
      if (!error) loadData();
    }

    async function addModule(event) {
      event.preventDefault();
      const title = document.getElementById('modTitle').value.trim();
      const course = document.getElementById('modCourse').value.trim();
      const grupo = document.getElementById('modGroup').value.trim();
      const desc = document.getElementById('modDesc').value.trim();
      const url = document.getElementById('modUrl').value.trim();
      if (!title || !course || !grupo || !url) return alert('Completa los campos obligatorios y el grupo.');

      const { error } = await _supabase.from('modules').insert([{ title, course, grupo, "desc": desc, url }]);
      if (!error) { alert(`¡Módulo cargado para el ${grupo}!`); loadData(); }
    }

    async function deleteModule(id) {
      if (confirm('¿Eliminar módulo?')) {
        const { error } = await _supabase.from('modules').delete().eq('id', id);
        if (!error) loadData();
      }
    }

    async function addPresentation(event) {
      event.preventDefault();
      const title = document.getElementById('pptTitle').value.trim();
      const course = document.getElementById('pptCourse').value.trim();
      const grupo = document.getElementById('pptGroup').value.trim();
      const desc = document.getElementById('pptDesc').value.trim();
      const url = document.getElementById('pptUrl').value.trim();
      if (!title || !course || !grupo || !url) return alert('Completa los campos obligatorios y el grupo.');

      const { error } = await _supabase.from('presentations').insert([{ title, course, grupo, "desc": desc, url }]);
      if (!error) { alert(`¡Clase PPT cargada para el ${grupo}!`); loadData(); }
    }

    async function deletePresentation(id) {
      if (confirm('¿Eliminar clase?')) {
        const { error } = await _supabase.from('presentations').delete().eq('id', id);
        if (!error) loadData();
      }
    }

    async function addTask(event) {
      event.preventDefault();
      const title = document.getElementById('taskTitle').value.trim();
      const dueDate = document.getElementById('taskDueDate').value.trim();
      const grupo = document.getElementById('taskGroup').value.trim();
      const desc = document.getElementById('taskDesc').value.trim();
      if (!title || !dueDate || !grupo) return alert('Completa los campos obligatorios y el grupo.');

      const { error } = await _supabase.from('tasks').insert([{ title, due_date: dueDate, grupo, "desc": desc, url: '#', grades: {} }]);
      if (!error) { alert(`¡Módulo de evaluación registrado para el ${grupo}!`); loadData(); }
    }

    async function deleteTask(id) {
      if (confirm('¿Eliminar módulo de evaluación?')) {
        const { error } = await _supabase.from('tasks').delete().eq('id', id);
        if (!error) loadData();
      }
    }

    async function updateDetailedGrade(taskId, studentEmail, type, val) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      let gradesObj = task.grades || {};
      if (!gradesObj[studentEmail]) {
        gradesObj[studentEmail] = { asistencia: 100, clase: 100, practico: 100 };
      }

      if (typeof gradesObj[studentEmail] !== 'object') {
        let oldVal = gradesObj[studentEmail];
        gradesObj[studentEmail] = { asistencia: oldVal, clase: oldVal, practico: oldVal };
      }

      gradesObj[studentEmail][type] = val === '' ? 0 : Number(val);

      const { error } = await _supabase.from('tasks').update({ grades: gradesObj }).eq('id', taskId);
      if (!error) loadData();
    }

    function exportPDF() {
      const element = document.getElementById('pdfTableContainer');
      const opt = {
        margin:       0.4,
        filename:     'Registro_Calificaciones_Detallado_ALR.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
      };
      html2pdf().from(element).set(opt).save();
    }

    function exportCertificatePDF() {
      const element = document.getElementById('certificateContainer');
      const studentNameInput = document.getElementById('certStudentName');
      const studentName = studentNameInput ? studentNameInput.value : 'Estudiante';
      const opt = {
        margin:       0,
        filename:     `Certificado_${studentName.replace(/\s+/g, '_')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'in', format: [11, 8.5], orientation: 'landscape' }
      };
      html2pdf().from(element).set(opt).save();
    }

    function updateCertificateName(val) {
      const displayEl = document.getElementById('displayStudentName');
      if (!displayEl) return;
      if (!val) {
        displayEl.innerHTML = '[Nombre del Estudiante]';
        return;
      }
      displayEl.innerText = val;
    }

    function selectStudentForCert(selectEl) {
      const val = selectEl.value;
      const inputName = document.getElementById('certStudentName');
      if (inputName && val) {
        inputName.value = val;
        updateCertificateName(val);
      }
    }

    async function addQuestion(event) {
      event.preventDefault();
      const text = document.getElementById('newQText').value.trim();
      if (!text) return;

      const { error } = await _supabase.from('questions').insert([{
        student: state.user.name,
        question: text,
        answer: '',
        answered: false
      }]);
      if (!error) { document.getElementById('newQText').value = ''; loadData(); }
    }

    async function answerQuestion(qId) {
      const input = document.getElementById(`ans-${qId}`);
      const text = input.value.trim();
      if (!text) return;

      const { error } = await _supabase.from('questions').update({ answer: text, answered: true }).eq('id', qId);
      if (!error) loadData();
    }

    async function resetSalonData() {
      if (confirm('¿Estás seguro de eliminar todo el contenido del salón?')) {
        await _supabase.from('posts').delete().neq('id', 0);
        await _supabase.from('modules').delete().neq('id', 0);
        await _supabase.from('presentations').delete().neq('id', 0);
        await _supabase.from('tasks').delete().neq('id', 0);
        await _supabase.from('questions').delete().neq('id', 0);
        loadData();
        alert('¡Salón reiniciado por completo!');
      }
    }

    function render() {
      const app = document.getElementById('app');

      if (!state.user) {
        app.innerHTML = `
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 w-full">
            <div class="bg-white max-w-md w-full rounded-2xl shadow-2xl p-8 border-t-4 border-emerald-600">
              <div class="text-center mb-6">
                <div class="inline-flex p-1 bg-white rounded-xl shadow-sm mb-2 border border-slate-200">
                  <img src="Logoalr.jpg" alt="Logo ALR" class="w-12 h-12 object-cover rounded-lg">
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Capacitaciones ALR</h1>
                <p class="text-xs text-slate-500 mt-1">Portal Educativo Privado (Supabase Cloud)</p>
              </div>

              ${loginErrorMsg ? `<div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-xs font-semibold">${loginErrorMsg}</div>` : ''}

              <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Correo Electrónico</label>
                  <input type="email" id="emailInput" required placeholder="ej. correo@estudiante.com" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Número de Cédula</label>
                  <input type="text" id="cedulaInput" required placeholder="ej. 8-900-456" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs shadow transition">
                  Ingresar al Campus Privado
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      // Encabezado Fijo (Sticky Header)
      app.innerHTML = `
        <header class="bg-slate-900 text-white shadow w-full sticky top-0 z-50">
          <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
              <div class="bg-white p-0.5 rounded-lg border border-slate-700 flex items-center justify-center">
                <img src="Logoalr.jpg" alt="Logo ALR" class="w-9 h-9 object-cover rounded-md">
              </div>
              <div>
                <h2 class="font-bold text-sm leading-tight">Capacitaciones ALR</h2>
                <span class="text-[10px] text-emerald-400">Portal Educativo Oficial ${state.user.grupo ? `• ${state.user.grupo}` : ''}</span>
              </div>
            </div>

            <div class="flex items-center space-x-3">
              ${state.user.role === 'admin' ? `
                <button onclick="resetSalonData()" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded text-[11px] font-semibold transition hidden sm:inline-block">
                  🔄 Resetear Salón
                </button>
              ` : ''}
              <div class="text-right hidden md:block">
                <p class="text-xs font-bold text-slate-200">${state.user.name}</p>
                <p class="text-[9px] text-slate-400 uppercase">${state.user.role === 'admin' ? 'Capacitador / Admin' : (state.user.grupo || 'Estudiante')}</p>
              </div>
              <button onclick="logout()" class="bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white px-3 py-1.5 rounded text-xs transition hidden sm:inline-block">
                Salir
              </button>

              <button id="menuBtn" onclick="toggleMenu(event)" class="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg focus:outline-none flex flex-col justify-center items-center w-9 h-9 space-y-1">
                <span class="block w-5 h-0.5 bg-white"></span>
                <span class="block w-5 h-0.5 bg-white"></span>
                <span class="block w-5 h-0.5 bg-white"></span>
              </button>
            </div>
          </div>

          ${state.menuOpen ? `
            <div id="dropdownMenu" class="absolute top-full right-4 mt-2 w-64 bg-white rounded-xl shadow-2xl border border-slate-200 py-2 z-50 text-slate-800">
              <div class="px-4 py-2 border-b border-slate-100 sm:hidden">
                <p class="text-xs font-bold">${state.user.name}</p>
                <p class="text-[10px] text-slate-500 uppercase">${state.user.role === 'admin' ? 'Capacitador / Admin' : (state.user.grupo || 'Estudiante')}</p>
              </div>
              <button onclick="setTab('muro')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'muro' ? 'text-emerald-700 bg-emerald-50' : ''}">💬 Muro Social</button>
              <button onclick="setTab('modulos')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'modulos' ? 'text-emerald-700 bg-emerald-50' : ''}">📚 Módulos y PDFs</button>
              <button onclick="setTab('ppt')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'ppt' ? 'text-red-700 bg-red-50' : ''}">📊 Clase PPT</button>
              
              ${state.user.role === 'admin' ? `
                <button onclick="setTab('tareas')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'tareas' ? 'text-emerald-700 bg-emerald-50' : ''}">📝 Módulos de Evaluación</button>
              ` : ''}

              <button onclick="setTab('calificaciones')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'calificaciones' ? 'text-emerald-700 bg-emerald-50' : ''}">🏆 Registro Detallado (PDF)</button>
              <button onclick="setTab('preguntas')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'preguntas' ? 'text-emerald-700 bg-emerald-50' : ''}">❓ Preguntas</button>
              
              ${state.user.role === 'admin' ? `
                <button onclick="setTab('certificados')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 border-t border-slate-100 ${state.activeTab === 'certificados' ? 'text-emerald-700 bg-emerald-50' : ''}">📜 Generador de Certificados</button>
                <button onclick="setTab('estudiantes')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'estudiantes' ? 'text-emerald-700 bg-emerald-50' : ''}">👥 Gestión de Grupo</button>
              ` : ''}

              <div class="border-t border-slate-100 mt-1 pt-1 sm:hidden">
                ${state.user.role === 'admin' ? `
                  <button onclick="resetSalonData()" class="w-full text-left px-4 py-2 text-xs font-semibold text-amber-600 hover:bg-amber-50">🔄 Resetear Salón</button>
                ` : ''}
                <button onclick="logout()" class="w-full text-left px-4 py-2 text-xs font-semibold text-red-600 hover:bg-red-50">🚪 Salir</button>

        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">

        <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs border-t border-slate-800 mt-auto">

    }

    function renderTabContent() {
      const userGroup = state.user.role === 'admin' ? null : state.user.grupo;

      if (state.activeTab === 'estudiantes' && state.user.role === 'admin') {
        const studentsList = state.whitelist.filter(u => u.role === 'student');
        return `
          <div class="space-y-6">
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-5 shadow-sm">

              <form onsubmit="addStudent(event)" class="space-y-3">
                <div class="grid gap-3 sm:grid-cols-4">
                  <input type="text" id="studentName" required placeholder="Nombre completo" class="p-2 border rounded text-xs bg-white">
                  <input type="email" id="studentEmail" required placeholder="Correo electrónico" class="p-2 border rounded text-xs bg-white">
                  <input type="text" id="studentCedula" required placeholder="Número de cédula" class="p-2 border rounded text-xs bg-white">
                  <input type="text" id="studentGroup" required placeholder="Grupo (ej. Grupo Febrero 2027)" class="p-2 border rounded text-xs bg-white">

                <div class="flex justify-end">

            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
              <h3 class="text-sm font-bold text-slate-900">Estudiantes Autorizados en Supabase</h3>
              ${studentsList.length === 0 ? '<p class="text-center text-xs text-slate-400 py-6">No hay estudiantes registrados.</p>' : `
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs text-slate-600">
                    <thead class="bg-slate-50 text-slate-700 uppercase text-[9px]">
                      <tr>
                        <th class="py-2.5 px-3">Nombre</th>
                        <th class="py-2.5 px-3">Correo</th>
                        <th class="py-2.5 px-3">Cédula</th>

                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${studentsList.map(st => `
                        <tr>
                          <td class="py-2.5 px-3 font-bold text-slate-800">${st.name}</td>

                          <td class="py-2.5 px-3">${st.cedula}</td>
                          <td class="py-2.5 px-3 font-semibold text-emerald-700">${st.grupo || 'Sin Grupo'}</td>
                          <td class="py-2.5 px-3 text-center">

                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'certificados' && state.user.role === 'admin') {
        const studentsList = state.whitelist.filter(u => u.role === 'student');
        return `
          <div class="space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">

                          </div>
                          <div>
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${isApproved ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                              ${isApproved ? 'APROBADO (≥90)' : 'REPROBADO (<90)'}
                            </span>
                          </div>
                        </div>

                        ${isExpanded || !isAdmin ? `
                          <div class="p-4 space-y-4 bg-slate-50/70">
                            ${tasksList.length === 0 ? '<p class="text-center text-xs text-slate-400 py-3">No hay módulos de evaluación configurados para este grupo.</p>' : `
                              <div class="grid gap-3 sm:grid-cols-2 md:grid-cols-3">
                                ${tasksList.map(t => {
                                  const grades = (t.grades && t.grades[st.email]) ? t.grades[st.email] : { asistencia: 100, clase: 100, practico: 100 };
                                  const asis = Number(grades.asistencia) || 0;
                                  const clas = Number(grades.clase) || 0;
                                  const prac = Number(grades.practico) || 0;
                                  const subTotal = Math.round((asis * 0.10) + (clas * 0.20) + (prac * 0.70));

                                  return `
                                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs space-y-2">
                                      <div class="border-b pb-1.5 flex justify-between items-center">
                                        <h5 class="font-bold text-slate-800 text-xs">${t.title}</h5>
                                        <span class="text-[9px] bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-semibold">Subtotal: ${subTotal} pts</span>
                                      </div>
                                      <div class="grid grid-cols-3 gap-1 text-center text-[10px]">
                                        <div>
                                          <label class="block text-slate-500 text-[9px] mb-0.5 font-semibold">Asis. (10%)</label>
                                          ${isAdmin ? `
                                            <input type="number" min="0" max="100" value="${grades.asistencia}" onchange="updateDetailedGrade(${t.id}, '${st.email}', 'asistencia', this.value)" class="w-full p-1 border rounded text-center text-xs font-bold text-emerald-700 bg-slate-50">
                                          ` : `<span class="font-bold text-slate-700">${grades.asistencia}</span>`}
                                        </div>
                                        <div>
                                          <label class="block text-slate-500 text-[9px] mb-0.5 font-semibold">Clase (20%)</label>
                                          ${isAdmin ? `
                                            <input type="number" min="0" max="100" value="${grades.clase}" onchange="updateDetailedGrade(${t.id}, '${st.email}', 'clase', this.value)" class="w-full p-1 border rounded text-center text-xs font-bold text-emerald-700 bg-slate-50">
                                          ` : `<span class="font-bold text-slate-700">${grades.clase}</span>`}
                                        </div>
                                        <div>
                                          <label class="block text-slate-500 text-[9px] mb-0.5 font-semibold">Práct. (70%)</label>
                                          ${isAdmin ? `
                                            <input type="number" min="0" max="100" value="${grades.practico}" onchange="updateDetailedGrade(${t.id}, '${st.email}', 'practico', this.value)" class="w-full p-1 border rounded text-center text-xs font-bold text-emerald-700 bg-slate-50">
                                          ` : `<span class="font-bold text-slate-700">${grades.practico}</span>`}
                                        </div>
                                      </div>
                                    </div>
                                  `;
                                }).join('')}
                              </div>
                            `}
                          </div>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'preguntas') {
        return `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h3 class="text-sm font-bold text-slate-900">Preguntas Directas al Capacitador</h3>
            <form onsubmit="addQuestion(event)">
              <textarea id="newQText" rows="2" placeholder="Escribe tu consulta..." class="w-full p-2.5 border rounded text-xs focus:outline-none resize-none"></textarea>
              <div class="flex justify-end mt-2">
                <button type="submit" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-semibold">Enviar Consulta</button>
              </div>
            </form>
            <div class="space-y-3 pt-2">
              ${state.questions.length === 0 ? '<p class="text-center text-xs text-slate-400 py-6">No hay preguntas registradas.</p>' : `
                ${state.questions.map(q => `
                  <div class="border rounded-lg p-3 bg-slate-50 space-y-2 text-xs">
                    <div class="font-bold text-slate-800">Consulta de: ${q.student}</div>
                    <p class="bg-white p-2.5 rounded border">"${q.question}"</p>
                    ${q.answered ? `
                      <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded text-emerald-900">
                        <b>Respuesta Oficial:</b> ${q.answer}
                      </div>
                    ` : (state.user.role === 'admin' ? `
                      <div class="space-y-1 pt-1">
                        <input type="text" id="ans-${q.id}" placeholder="Escribe la respuesta..." class="w-full bg-white border rounded px-2 py-1 text-xs">
                        <button onclick="answerQuestion(${q.id})" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-semibold">Publicar Respuesta</button>
                      </div>
                    ` : '<span class="text-amber-600 font-semibold text-[11px]">Pendiente de respuesta</span>')}
                  </div>
                `).join('')}
              `}
            </div>
          </div>
        `;
      }
    }

    loadData();
  </script>
</body>
</html>
