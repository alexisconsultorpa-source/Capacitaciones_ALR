<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacitaciones ALR - Portal Web Privado</title>
  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden">

  <!-- Contenedor Principal de la App -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- Lógica de la Aplicación con Almacenamiento Local (localStorage) -->
  <script>
    const defaultState = {
      user: null,
      activeTab: 'muro',
      posts: [
        {
          id: 1,
          author: 'Alexis León Rivera (Capacitador)',
          role: 'admin',
          content: '¡Bienvenidos al salón oficial de Capacitaciones ALR! Recuerden revisar su cronograma de campo para esta semana.',
          timestamp: 'Hace 2 horas',
          likes: 5,
          comments: [
            { id: 101, author: 'Carlos Mendoza', content: '¡Entendido profesor! Listo para iniciar las prácticas.', timestamp: 'Hace 1 hora' }
          ]
        }
      ],
      modules: [
        { id: 1, course: 'Supervisor de EDS', title: 'Módulo 1: Enfoque Sistémico y Liderazgo en Pista', desc: 'Diagnóstico integral de los 5 sistemas organizacionales y estilos de dirección.', url: '#' },
        { id: 2, course: 'Mentor ALR', title: 'Módulo 2: El Rol del Mentor y Arquetipos de Apoyo', desc: 'Metodología de acompañamiento par a par y adaptación en tienda Super7.', url: '#' },
        { id: 3, course: 'Capacitador Operativo', title: 'Módulo 3: DNC y Diseño Instruccional Operativo', desc: 'Aplicación del Pareto 80/20, Hojas HDT y alineación con normas INADEH.', url: '#' }
      ],
      tasks: [
        { id: 1, title: 'Tarea 1: Matriz de Diagnóstico Sistémico y Mapeo en EDS', desc: 'Realizar el levantamiento de procesos y mapeo operativo en pista.', dueDate: 'Viernes, 11:59 PM', status: 'Pendiente', grade: null, url: '#' },
        { id: 2, title: 'Tarea 2: Bitácora de Campo de Mentoría y Arquetipos', desc: 'Completar registros de acompañamiento par a par.', dueDate: 'Viernes, 11:59 PM', status: 'Pendiente', grade: null, url: '#' },
        { id: 3, title: 'Tarea 3: Diseño de Hoja de Descomposición de Trabajo (HDT)', desc: 'Desglose técnico de operaciones críticas.', dueDate: 'Viernes, 11:59 PM', status: 'Pendiente', grade: null, url: '#' }
      ],
      questions: [
        { id: 1, student: 'María Rodríguez', question: '¿Cómo procedo si el administrador de la estación no puede firmar la bitácora el viernes?', answer: 'Puedes programar la firma para primera hora del lunes siguiente notificándolo previamente por este medio.', answered: true }
      ],
      photos: [
        { id: 1, title: 'Práctica de Calibración con Serafín en Pista', author: 'Carlos Mendoza', url: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=600&q=80' },
        { id: 2, title: 'Simulación de Auditoría y Servicio en Tienda Super7', author: 'Ana Gómez', url: 'https://images.unsplash.com/photo-1556740758-90de374c12ad?auto=format&fit=crop&w=600&q=80' }
      ]
    };

    let state = JSON.parse(localStorage.getItem('alr_app_state')) || defaultState;
    state.user = null;

    function saveState() {
      localStorage.setItem('alr_app_state', JSON.stringify(state));
    }

    const whitelist = [
      { email: 'alexis.leon@capacitacionesalr.com', cedula: '4-700-123', name: 'Alexis León Rivera', role: 'admin' },
      { email: 'carlos.mendoza@student.com', cedula: '8-900-456', name: 'Carlos Mendoza', role: 'student' },
      { email: 'ana.gomez@student.com', cedula: '2-500-789', name: 'Ana Gómez', role: 'student' }
    ];

    let loginErrorMsg = '';

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const cedula = document.getElementById('cedulaInput').value.trim();

      const found = whitelist.find(u => u.email.toLowerCase() === email.toLowerCase() && u.cedula === cedula);
      if (found) {
        state.user = found;
        loginErrorMsg = '';
        render();
      } else {
        loginErrorMsg = 'Correo o número de cédula no autorizado o incorrecto.';
        render();
      }
    }

    function logout() {
      state.user = null;
      render();
    }

    function setTab(tab) {
      state.activeTab = tab;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function addPost(event) {
      event.preventDefault();
      const text = document.getElementById('newPostText').value.trim();
      if (!text) return;

      state.posts.unshift({
        id: Date.now(),
        author: state.user.name + (state.user.role === 'admin' ? ' (Capacitador)' : ''),
        role: state.user.role,
        content: text,
        timestamp: 'Justo ahora',
        likes: 0,
        comments: []
      });
      saveState();
      render();
    }

    function deletePost(id) {
      state.posts = state.posts.filter(p => p.id !== id);
      saveState();
      render();
    }

    function likePost(id) {
      const p = state.posts.find(item => item.id === id);
      if (p) {
        p.likes += 1;
        saveState();
        render();
      }
    }

    function addComment(postId, event) {
      event.preventDefault();
      const input = document.getElementById(`comment-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const p = state.posts.find(item => item.id === postId);
      if (p) {
        p.comments.push({
          id: Date.now(),
          author: state.user.name,
          content: text,
          timestamp: 'Justo ahora'
        });
        saveState();
        render();
      }
    }

    function addModule(event) {
      event.preventDefault();
      const title = document.getElementById('modTitle').value.trim();
      const course = document.getElementById('modCourse').value.trim();
      const desc = document.getElementById('modDesc').value.trim();
      const url = document.getElementById('modUrl').value.trim();

      if (!title || !course || !url) return alert('Por favor completa los campos obligatorios.');

      state.modules.push({
        id: Date.now(),
        course: course,
        title: title,
        desc: desc,
        url: url
      });
      saveState();
      render();
      alert('¡Módulo cargado con éxito!');
    }

    function deleteModule(id) {
      if (confirm('¿Deseas eliminar este módulo?')) {
        state.modules = state.modules.filter(m => m.id !== id);
        saveState();
        render();
      }
    }

    function addTask(event) {
      event.preventDefault();
      const title = document.getElementById('taskTitle').value.trim();
      const dueDate = document.getElementById('taskDueDate').value.trim();
      const desc = document.getElementById('taskDesc').value.trim();
      const url = document.getElementById('taskUrl').value.trim();

      if (!title || !dueDate || !url) return alert('Por favor completa los campos obligatorios.');

      state.tasks.push({
        id: Date.now(),
        title: title,
        desc: desc,
        dueDate: dueDate,
        status: 'Pendiente',
        grade: null,
        url: url
      });
      saveState();
      render();
      alert('¡Tarea cargada con éxito!');
    }

    function deleteTask(id) {
      if (confirm('¿Deseas eliminar esta tarea?')) {
        state.tasks = state.tasks.filter(t => t.id !== id);
        saveState();
        render();
      }
    }

    function submitTask(taskId) {
      alert('¡Tarea enviada con éxito! Calificación automática generada: 100 pts.');
      const t = state.tasks.find(item => item.id === taskId);
      if (t) {
        t.status = 'Completada';
        t.grade = 100;
        saveState();
        render();
      }
    }

    function addQuestion(event) {
      event.preventDefault();
      const text = document.getElementById('newQText').value.trim();
      if (!text) return;

      state.questions.push({
        id: Date.now(),
        student: state.user.name,
        question: text,
        answer: '',
        answered: false
      });
      saveState();
      render();
    }

    function answerQuestion(qId) {
      const input = document.getElementById(`ans-${qId}`);
      const text = input.value.trim();
      if (!text) return;

      const q = state.questions.find(item => item.id === qId);
      if (q) {
        q.answer = text;
        q.answered = true;
        saveState();
        render();
      }
    }

    function addPhoto(event) {
      event.preventDefault();
      const title = document.getElementById('photoTitle').value.trim();
      const url = document.getElementById('photoUrl').value.trim();
      if (!title || !url) return;

      state.photos.unshift({
        id: Date.now(),
        title: title,
        author: state.user.name,
        url: url
      });
      saveState();
      render();
    }

    function resetSalonData() {
      if (confirm('¿Estás seguro de limpiar todos los datos del salón actual para iniciar con un nuevo grupo? Se restablecerán los valores por defecto.')) {
        localStorage.removeItem('alr_app_state');
        state = JSON.parse(JSON.stringify(defaultState));
        state.user = { name: 'Alexis León Rivera', role: 'admin', email: 'alexis.leon@capacitacionesalr.com' };
        render();
        alert('¡Salón reiniciado con éxito para un nuevo grupo!');
      }
    }

    function render() {
      const app = document.getElementById('app');

      if (!state.user) {
        app.innerHTML = `
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 w-full">
            <div class="bg-white max-w-md w-full rounded-2xl shadow-2xl p-8 border-t-4 border-emerald-600">
              <div class="text-center mb-6">
                <div class="inline-flex p-3 bg-emerald-50 rounded-full text-emerald-600 mb-2 font-bold text-xl">🛡️</div>
                <h1 class="text-2xl font-bold text-slate-800">Capacitaciones ALR</h1>
                <p class="text-xs text-slate-500 mt-1">Portal Educativo Privado y Seguro</p>
              </div>

              ${loginErrorMsg ? `<div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-xs font-semibold">${loginErrorMsg}</div>` : ''}

              <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Correo Electrónico</label>
                  <input type="email" id="emailInput" required placeholder="ej. carlos.mendoza@student.com" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Número de Cédula</label>
                  <input type="text" id="cedulaInput" required placeholder="ej. 8-900-456" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs shadow transition">
                  Ingresar al Campus Privado
                </button>
              </form>

              <div class="mt-6 pt-4 border-t border-slate-100 text-[11px] text-slate-500 bg-slate-50 p-3 rounded">
                <span class="font-bold block text-slate-700 mb-1">Cuentas autorizadas de prueba:</span>
                • Admin: alexis.leon@capacitacionesalr.com | Cédula: <b class="text-emerald-700">4-700-123</b><br>
                • Estudiante: carlos.mendoza@student.com | Cédula: <b class="text-emerald-700">8-900-456</b>
              </div>
            </div>
          </div>
        `;
        return;
      }

      app.innerHTML = `
        <!-- Barra superior fija -->
        <header class="bg-slate-900 text-white shadow sticky top-0 z-50 w-full">
          <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
              <div class="bg-emerald-600 p-2 rounded-lg font-bold">🛡️</div>
              <div>
                <h2 class="font-bold text-sm leading-tight">Capacitaciones ALR</h2>
                <span class="text-[10px] text-emerald-400">Portal Educativo Oficial</span>
              </div>
            </div>
            <div class="flex items-center space-x-3">
              ${state.user.role === 'admin' ? `
                <button onclick="resetSalonData()" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded text-[11px] font-semibold transition" title="Limpiar datos para nuevo salón">
                  🔄 Resetear Salón
                </button>
              ` : ''}
              <div class="text-right hidden sm:block">
                <p class="text-xs font-bold text-slate-200">${state.user.name}</p>
                <p class="text-[9px] text-slate-400 uppercase">${state.user.role === 'admin' ? 'Capacitador / Admin' : 'Estudiante'}</p>
              </div>
              <button onclick="logout()" class="bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white px-3 py-1.5 rounded text-xs transition">
                Salir
              </button>
            </div>
          </div>
        </header>

        <!-- Menú de navegación fijo debajo de la barra -->
        <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-[57px] z-40 w-full overflow-x-auto">
          <div class="max-w-7xl mx-auto px-4 flex space-x-4 whitespace-nowrap">
            <button onclick="setTab('muro')" class="py-3 px-3 text-xs font-semibold border-b-2 ${state.activeTab === 'muro' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-600'}">💬 Muro Social</button>
            <button onclick="setTab('modulos')" class="py-3 px-3 text-xs font-semibold border-b-2 ${state.activeTab === 'modulos' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-600'}">📚 Módulos y PDFs</button>
            <button onclick="setTab('tareas')" class="py-3 px-3 text-xs font-semibold border-b-2 ${state.activeTab === 'tareas' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-600'}">📝 Tareas y Word</button>
            <button onclick="setTab('calificaciones')" class="py-3 px-3 text-xs font-semibold border-b-2 ${state.activeTab === 'calificaciones' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-600'}">🏆 Calificaciones</button>
            <button onclick="setTab('preguntas')" class="py-3 px-3 text-xs font-semibold border-b-2 ${state.activeTab === 'preguntas' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-600'}">❓ Preguntas</button>
            <button onclick="setTab('fototeca')" class="py-3 px-3 text-xs font-semibold border-b-2 ${state.activeTab === 'fototeca' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-600'}">📷 Fototeca</button>
          </div>
        </nav>

        <!-- Contenido principal que se desliza de manera natural -->
        <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 my-auto">
          ${renderTabContent()}
        </main>

        <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs border-t border-slate-800 mt-auto">
          <p class="font-semibold text-slate-300">Capacitaciones ALR • Todos los derechos reservados</p>
        </footer>
      `;
    }

    function renderTabContent() {
      if (state.activeTab === 'muro') {
        return `
          <div class="space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
              <h3 class="text-xs font-bold text-slate-800 uppercase mb-2">Crear nueva publicación</h3>
              <form onsubmit="addPost(event)">
                <textarea id="newPostText" rows="3" placeholder="¿Qué deseas compartir con tu salón?" class="w-full p-3 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>
                <div class="flex justify-end mt-2">
                  <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow">Publicar</button>
                </div>
              </form>
            </div>

            <div class="space-y-4">
              ${state.posts.map(p => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="font-bold text-slate-900 text-xs">${p.author}</h4>
                      <span class="text-[10px] text-slate-400">${p.timestamp}</span>
                    </div>
                    ${state.user.role === 'admin' || p.author.includes(state.user.name) ? `<button onclick="deletePost(${p.id})" class="text-slate-400 hover:text-red-600 text-xs">🗑️</button>` : ''}
                  </div>
                  <p class="text-slate-700 text-xs">${p.content}</p>
                  <div class="flex items-center space-x-3 pt-2 border-t border-slate-100 text-xs">
                    <button onclick="likePost(${p.id})" class="text-emerald-600 font-semibold hover:underline">👍 ${p.likes} Me gusta</button>
                    <span class="text-slate-400">•</span>
                    <span class="text-slate-500">${p.comments.length} Comentarios</span>
                  </div>
                  <div class="bg-slate-50 rounded-lg p-2.5 space-y-2">
                    ${p.comments.map(c => `
                      <div class="text-[11px] bg-white p-2 rounded border border-slate-200">
                        <span class="font-bold text-slate-800">${c.author}:</span> ${c.content}
                      </div>
                    `).join('')}
                    <form onsubmit="addComment(${p.id}, event)" class="flex gap-2 pt-1">
                      <input type="text" id="comment-${p.id}" placeholder="Escribe un comentario..." class="flex-1 bg-white border border-slate-300 rounded px-2 py-1 text-[11px] focus:outline-none">
                      <button type="submit" class="bg-slate-800 text-white px-3 py-1 rounded text-[11px] font-semibold">Comentar</button>
                    </form>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'modulos') {
        return `
          <div class="space-y-6">
            ${state.user.role === 'admin' ? `
              <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-5 shadow-sm">
                <h3 class="text-xs font-bold text-emerald-900 uppercase mb-3">➕ Cargar Nuevo Módulo / Material (Panel de Administrador)</h3>
                <form onsubmit="addModule(event)" class="space-y-3">
                  <div class="grid gap-3 sm:grid-cols-2">
                    <input type="text" id="modTitle" required placeholder="Título del Módulo (ej. Módulo 4: HSE)" class="p-2 border rounded text-xs bg-white">
                    <input type="text" id="modCourse" required placeholder="Nombre del Programa (ej. Supervisor EDS)" class="p-2 border rounded text-xs bg-white">
                  </div>
                  <textarea id="modDesc" rows="2" placeholder="Breve descripción del contenido..." class="w-full p-2 border rounded text-xs bg-white resize-none"></textarea>
                  <input type="text" id="modUrl" required placeholder="Enlace web del archivo (ej. Google Drive o PDF)" class="w-full p-2 border rounded text-xs bg-white">
                  <div class="flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold shadow">Cargar Módulo</button>
                  </div>
                </form>
              </div>
            ` : ''}

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
              <h3 class="text-sm font-bold text-slate-900">Módulos Académicos Oficiales</h3>
              <p class="text-xs text-slate-500">Materiales de estudio obligatorios de Capacitaciones ALR.</p>
              <div class="grid gap-4 sm:grid-cols-3">
                ${state.modules.map(m => `
                  <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 flex flex-col justify-between relative">
                    ${state.user.role === 'admin' ? `<button onclick="deleteModule(${m.id})" class="absolute top-3 right-3 text-slate-400 hover:text-red-600 text-xs" title="Eliminar módulo">🗑️</button>` : ''}
                    <div>
                      <span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 mb-2 inline-block">${m.course}</span>
                      <h4 class="font-bold text-slate-900 text-xs mb-1 pr-6">${m.title}</h4>
                      <p class="text-[11px] text-slate-600 mb-4">${m.desc}</p>
                    </div>
                    <a href="${m.url !== '#' ? m.url : '#'}" target="_blank" onclick="${m.url === '#' ? "alert('Abriendo documento oficial...'); return false;" : ""}" class="block text-center w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold">📄 Ver Módulo</a>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'tareas') {
        return `
          <div class="space-y-6">
            ${state.user.role === 'admin' ? `
              <div class="bg-blue-50 border border-blue-200 rounded-xl p-5 shadow-sm">
                <h3 class="text-xs font-bold text-blue-900 uppercase mb-3">➕ Cargar Nueva Tarea / Entregable (Panel de Administrador)</h3>
                <form onsubmit="addTask(event)" class="space-y-3">
                  <div class="grid gap-3 sm:grid-cols-2">
                    <input type="text" id="taskTitle" required placeholder="Título de la Tarea (ej. Tarea 4: Auditoría)" class="p-2 border rounded text-xs bg-white">
                    <input type="text" id="taskDueDate" required placeholder="Fecha límite (ej. Viernes, 11:59 PM)" class="p-2 border rounded text-xs bg-white">
                  </div>
                  <textarea id="taskDesc" rows="2" placeholder="Instrucciones o descripción de la tarea..." class="w-full p-2 border rounded text-xs bg-white resize-none"></textarea>
                  <input type="text" id="taskUrl" required placeholder="Enlace web de la tarea (ej. Documento guía en Drive o PDF)" class="w-full p-2 border rounded text-xs bg-white">
                  <div class="flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold shadow">Cargar Tarea</button>
                  </div>
                </form>
              </div>
            ` : ''}

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 class="text-sm font-bold text-slate-900 mb-1">Entregables y Tareas de Campo</h3>
              <p class="text-xs text-slate-500 mb-4">Consulta las tareas y sube tus reportes en PDF directamente a la carpeta oficial.</p>
              <div class="space-y-4">
                ${state.tasks.map(t => `
                  <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 relative">
                    ${state.user.role === 'admin' ? `<button onclick="deleteTask(${t.id})" class="absolute top-3 right-3 text-slate-400 hover:text-red-600 text-xs" title="Eliminar tarea">🗑️</button>` : ''}
                    <div>
                      <div class="flex items-center space-x-2">
                        <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${t.status === 'Completada' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${t.status}</span>
                        <span class="text-[10px] text-slate-400">📅 Entrega: ${t.dueDate}</span>
                      </div>
                      <h4 class="font-bold text-slate-900 text-xs mt-1 pr-6">${t.title}</h4>
                      <p class="text-[11px] text-slate-600 mt-0.5">${t.desc || ''}</p>
                      ${t.grade !== null ? `<p class="text-[11px] text-emerald-600 font-bold mt-1">Calificación: ${t.grade} / 100 pts</p>` : ''}
                    </div>
                    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                      <a href="${t.url !== '#' ? t.url : '#'}" target="_blank" onclick="${t.url === '#' ? "alert('Abriendo guía de tarea...'); return false;" : ""}" class="flex-1 sm:flex-none text-center px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded text-xs font-semibold">📄 Ver Tarea</a>
                      <a href="https://drive.google.com/drive/folders/1DeIHSbZiiSidRHdvJmyPRBpy8VT3WFTP" target="_blank" class="flex-1 sm:flex-none text-center px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold">📤 Cargar Tarea (PDF)</a>
                      <button onclick="submitTask(${t.id})" class="flex-1 sm:flex-none text-center px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold">✅ Marcar Entregada</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'calificaciones') {
        return `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h3 class="text-sm font-bold text-slate-900">Registro de Calificaciones Automáticas</h3>
            <p class="text-xs text-slate-500">Evaluación en tiempo real del salón actual.</p>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-600">
                <thead class="bg-slate-50 text-slate-700 uppercase text-[9px]">
                  <tr>
                    <th class="py-2.5 px-3">Estudiante</th>
                    <th class="py-2.5 px-3 text-center">Tarea 1</th>
                    <th class="py-2.5 px-3 text-center">Tarea 2</th>
                    <th class="py-2.5 px-3 text-center">Tarea 3</th>
                    <th class="py-2.5 px-3 text-center">Promedio</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <tr><td class="py-2.5 px-3 font-bold">Carlos Mendoza</td><td class="text-center">100</td><td class="text-center">90</td><td class="text-center">95</td><td class="text-center font-bold text-emerald-600">95 pts</td></tr>
                  <tr><td class="py-2.5 px-3 font-bold">Ana Gómez</td><td class="text-center">85</td><td class="text-center">90</td><td class="text-center">90</td><td class="text-center font-bold text-emerald-600">88 pts</td></tr>
                  <tr><td class="py-2.5 px-3 font-bold">${state.user.name} (Tú)</td><td class="text-center">${state.tasks[0]?.grade || 0}</td><td class="text-center">${state.tasks[1]?.grade || 0}</td><td class="text-center">${state.tasks[2]?.grade || 0}</td><td class="text-center font-bold text-emerald-600">92 pts</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'preguntas') {
        return `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h3 class="text-sm font-bold text-slate-900">Preguntas Directas al Capacitador</h3>
            <p class="text-xs text-slate-500">Espacio privado de consultas para el profesor Alexis León Rivera.</p>
            <form onsubmit="addQuestion(event)">
              <textarea id="newQText" rows="2" placeholder="Escribe tu consulta..." class="w-full p-2.5 border rounded text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500 resize-none"></textarea>
              <div class="flex justify-end mt-2">
                <button type="submit" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-semibold">Enviar Consulta</button>
              </div>
            </form>
            <div class="space-y-3 pt-2">
              ${state.questions.map(q => `
                <div class="border rounded-lg p-3 bg-slate-50 space-y-2 text-xs">
                  <div class="font-bold text-slate-800">Consulta de: ${q.student}</div>
                  <p class="bg-white p-2.5 rounded border">"${q.question}"</p>
                  ${q.answered ? `
                    <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded text-emerald-900">
                      <b>Respuesta Oficial de Alexis León Rivera:</b> ${q.answer}
                    </div>
                  ` : (state.user.role === 'admin' ? `
                    <div class="space-y-1 pt-1">
                      <input type="text" id="ans-${q.id}" placeholder="Escribe la respuesta oficial..." class="w-full bg-white border rounded px-2 py-1 text-xs">
                      <button onclick="answerQuestion(${q.id})" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-semibold">Publicar Respuesta</button>
                    </div>
                  ` : '<span class="text-amber-600 font-semibold text-[11px]">Pendiente de respuesta del capacitador</span>')}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'fototeca') {
        return `
          <form onsubmit="addPhoto(event)" class="bg-white border rounded-xl p-4 shadow-sm mb-6 space-y-2">
            <h4 class="font-bold text-slate-800 text-xs">Compartir nueva foto</h4>
            <div class="grid gap-2 sm:grid-cols-2">
              <input type="text" id="photoTitle" placeholder="Título (ej. Medición en Pista)" class="p-2 border rounded text-xs bg-white">
              <input type="text" id="photoUrl" placeholder="URL de imagen" class="p-2 border rounded text-xs bg-white">
            </div>
            <div class="flex justify-end">
              <button type="submit" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-semibold">Subir Foto</button>
            </div>
          </form>
          <div class="grid gap-4 sm:grid-cols-2">
            ${state.photos.map(p => `
              <div class="border rounded-xl overflow-hidden bg-slate-50 shadow-sm">
                <div class="h-36 bg-slate-200">
                  <img src="${p.url}" alt="${p.title}" class="w-full h-full object-cover">
                </div>
                <div class="p-3">
                  <h5 class="font-bold text-slate-800 text-xs mb-0.5">${p.title}</h5>
                  <p class="text-[10px] text-slate-500">Subido por: ${p.author}</p>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    render();
  </script>
</body>
</html>
