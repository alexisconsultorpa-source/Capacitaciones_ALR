<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacitaciones ALR - Portal Web Privado</title>
  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client por CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden" onclick="handleOutsideClick(event)">

  <!-- Contenedor Principal de la App -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- Lógica de la Aplicación con Supabase -->
  <script>
    // 🔑 CREDENCIALES OFICIALES DE SUPABASE
    const SUPABASE_URL = 'https://bvnsepupgHgluShNrdGl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-B-Lck4vqjF0eLf0UlXJzQ_jOhPg_XH';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let state = {
      user: null,
      activeTab: 'muro',
      menuOpen: false,
      whitelist: [],
      posts: [],
      modules: [],
      presentations: [],
      tasks: [],
      questions: [],
      photos: []
    };

    let loginErrorMsg = '';

    async function loadWhitelist() {
      try {
        const { data, error } = await _supabase.from('usuarios').select('*');
        if (!error && data) {
          state.whitelist = data;
        }
      } catch (err) {
        console.error('Error al conectar con Supabase:', err);
      }
      render();
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const cedula = document.getElementById('cedulaInput').value.trim();

      // Consultar todos los usuarios para hacer una validación robusta y segura desde la app
      const { data, error } = await _supabase
        .from('usuarios')
        .select('*');

      if (error || !data) {
        loginErrorMsg = 'Error al conectar con la base de datos de Supabase.';
        render();
        return;
      }

      // Buscar coincidencia ignorando mayúsculas/minúsculas en el correo y espacios en la cédula
      const matchedUser = data.find(u => 
        u.email.trim().toLowerCase() === email && 
        u.cedula.trim() === cedula
      );

      if (matchedUser) {
        state.user = matchedUser;
        state.activeTab = 'muro';
        state.menuOpen = false;
        loginErrorMsg = '';
        render();
      } else {
        loginErrorMsg = 'Correo o número de cédula no autorizado o incorrecto.';
        render();
      }
    }

    function logout() {
      state.user = null;
      render();
    }

    function setTab(tab) {
      state.activeTab = tab;
      state.menuOpen = false;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMenu(event) {
      if (event) event.stopPropagation();
      state.menuOpen = !state.menuOpen;
      render();
    }

    function handleOutsideClick(event) {
      if (state.menuOpen) {
        const menuEl = document.getElementById('dropdownMenu');
        const btnEl = document.getElementById('menuBtn');
        if (menuEl && !menuEl.contains(event.target) && btnEl && !btnEl.contains(event.target)) {
          state.menuOpen = false;
          render();
        }
      }
    }

    async function addStudent(event) {
      event.preventDefault();
      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim().toLowerCase();
      const cedula = document.getElementById('studentCedula').value.trim();

      if (!name || !email || !cedula) return alert('Por favor completa todos los campos.');

      const { error } = await _supabase.from('usuarios').insert([
        { name: name, email: email, cedula: cedula, role: 'student' }
      ]);

      if (error) {
        alert('Error: Este correo ya se encuentra registrado o hubo un problema.');
        console.error(error);
      } else {
        alert(`¡Estudiante ${name} registrado con éxito en la nube! Ya puede entrar desde cualquier dispositivo.`);
        document.getElementById('studentName').value = '';
        document.getElementById('studentEmail').value = '';
        document.getElementById('studentCedula').value = '';
        loadWhitelist();
      }
    }

    async function deleteStudent(email) {
      if (confirm('¿Deseas revocar el acceso a este estudiante?')) {
        const { error } = await _supabase.from('usuarios').delete().eq('email', email);
        if (error) {
          alert('No se pudo eliminar el usuario.');
        } else {
          loadWhitelist();
        }
      }
    }

    function addPost(event) {
      event.preventDefault();
      const text = document.getElementById('newPostText').value.trim();
      if (!text) return;
      state.posts.unshift({
        id: Date.now(),
        author: state.user.name + (state.user.role === 'admin' ? ' (Capacitador)' : ''),
        role: state.user.role,
        content: text,
        timestamp: 'Justo ahora',
        likes: 0,
        comments: []
      });
      render();
    }

    function deletePost(id) {
      state.posts = state.posts.filter(p => p.id !== id);
      render();
    }

    function likePost(id) {
      const p = state.posts.find(item => item.id === id);
      if (p) { p.likes += 1; render(); }
    }

    function addComment(postId, event) {
      event.preventDefault();
      const input = document.getElementById(`comment-${postId}`);
      const text = input.value.trim();
      if (!text) return;
      const p = state.posts.find(item => item.id === postId);
      if (p) {
        p.comments.push({ id: Date.now(), author: state.user.name, content: text, timestamp: 'Justo ahora' });
        render();
      }
    }

    function addModule(event) {
      event.preventDefault();
      const title = document.getElementById('modTitle').value.trim();
      const course = document.getElementById('modCourse').value.trim();
      const desc = document.getElementById('modDesc').value.trim();
      const url = document.getElementById('modUrl').value.trim();
      if (!title || !course || !url) return alert('Completa los campos obligatorios.');
      state.modules.push({ id: Date.now(), course, title, desc, url });
      render();
      alert('¡Módulo cargado!');
    }

    function deleteModule(id) {
      if (confirm('¿Eliminar módulo?')) {
        state.modules = state.modules.filter(m => m.id !== id);
        render();
      }
    }

    function addPresentation(event) {
      event.preventDefault();
      const title = document.getElementById('pptTitle').value.trim();
      const course = document.getElementById('pptCourse').value.trim();
      const desc = document.getElementById('pptDesc').value.trim();
      const url = document.getElementById('pptUrl').value.trim();
      if (!title || !course || !url) return alert('Completa los campos obligatorios.');
      state.presentations.push({ id: Date.now(), course, title, desc, url });
      render();
      alert('¡Clase PPT cargada!');
    }

    function deletePresentation(id) {
      if (confirm('¿Eliminar clase?')) {
        state.presentations = state.presentations.filter(p => p.id !== id);
        render();
      }
    }

    function addTask(event) {
      event.preventDefault();
      const title = document.getElementById('taskTitle').value.trim();
      const dueDate = document.getElementById('taskDueDate').value.trim();
      const desc = document.getElementById('taskDesc').value.trim();
      const url = document.getElementById('taskUrl').value.trim();
      if (!title || !dueDate || !url) return alert('Completa los campos obligatorios.');
      state.tasks.push({ id: Date.now(), title, desc, dueDate, status: 'Pendiente', grades: {}, url });
      render();
      alert('¡Tarea cargada!');
    }

    function deleteTask(id) {
      if (confirm('¿Eliminar tarea?')) {
        state.tasks = state.tasks.filter(t => t.id !== id);
        render();
      }
    }

    function submitTask(taskId) {
      alert('¡Tarea enviada! Calificación automática: 100 pts.');
      const t = state.tasks.find(item => item.id === taskId);
      if (t) {
        if (!t.grades) t.grades = {};
        t.grades[state.user.email] = 100;
        render();
      }
    }

    function updateGradeAdmin(taskId, studentEmail, val) {
      const t = state.tasks.find(item => item.id === taskId);
      if (t) {
        if (!t.grades) t.grades = {};
        t.grades[studentEmail] = val === '' ? null : Number(val);
      }
    }

    function addQuestion(event) {
      event.preventDefault();
      const text = document.getElementById('newQText').value.trim();
      if (!text) return;
      state.questions.push({ id: Date.now(), student: state.user.name, question: text, answer: '', answered: false });
      render();
    }

    function answerQuestion(qId) {
      const input = document.getElementById(`ans-${qId}`);
      const text = input.value.trim();
      if (!text) return;
      const q = state.questions.find(item => item.id === qId);
      if (q) { q.answer = text; q.answered = true; render(); }
    }

    function addPhoto(event) {
      event.preventDefault();
      const title = document.getElementById('photoTitle').value.trim();
      const url = document.getElementById('photoUrl').value.trim();
      if (!title || !url) return;
      state.photos.unshift({ id: Date.now(), title, author: state.user.name, url });
      render();
    }

    function resetSalonData() {
      if (confirm('¿Limpiar datos del salón actual?')) {
        state.posts = [];
        state.modules = [];
        state.presentations = [];
        state.tasks = [];
        state.questions = [];
        state.photos = [];
        render();
        alert('¡Salón reiniciado con éxito!');
      }
    }

    function render() {
      const app = document.getElementById('app');

      if (!state.user) {
        app.innerHTML = `
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 w-full">
            <div class="bg-white max-w-md w-full rounded-2xl shadow-2xl p-8 border-t-4 border-emerald-600">
              <div class="text-center mb-6">
                <div class="inline-flex p-3 bg-emerald-50 rounded-full text-emerald-600 mb-2 font-bold text-xl">🛡️</div>
                <h1 class="text-2xl font-bold text-slate-800">Capacitaciones ALR</h1>
                <p class="text-xs text-slate-500 mt-1">Portal Educativo Privado (Supabase Cloud)</p>
              </div>

              ${loginErrorMsg ? `<div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-xs font-semibold">${loginErrorMsg}</div>` : ''}

              <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Correo Electrónico</label>
                  <input type="email" id="emailInput" required placeholder="ej. correo@estudiante.com" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Número de Cédula</label>
                  <input type="text" id="cedulaInput" required placeholder="ej. 8-900-456" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs shadow transition">
                  Ingresar al Campus Privado
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      app.innerHTML = `
        <header class="bg-slate-900 text-white shadow w-full relative">
          <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
              <div class="bg-emerald-600 p-2 rounded-lg font-bold">🛡️</div>
              <div>
                <h2 class="font-bold text-sm leading-tight">Capacitaciones ALR</h2>
                <span class="text-[10px] text-emerald-400">Portal Educativo Oficial</span>
              </div>
            </div>

            <div class="flex items-center space-x-3">
              ${state.user.role === 'admin' ? `
                <button onclick="resetSalonData()" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded text-[11px] font-semibold transition hidden sm:inline-block">
                  🔄 Resetear Salón
                </button>
              ` : ''}
              <div class="text-right hidden md:block">
                <p class="text-xs font-bold text-slate-200">${state.user.name}</p>
                <p class="text-[9px] text-slate-400 uppercase">${state.user.role === 'admin' ? 'Capacitador / Admin' : 'Estudiante'}</p>
              </div>
              <button onclick="logout()" class="bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white px-3 py-1.5 rounded text-xs transition hidden sm:inline-block">
                Salir
              </button>

              <!-- Menú Hamburguesa -->
              <button id="menuBtn" onclick="toggleMenu(event)" class="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg focus:outline-none flex flex-col justify-center items-center w-9 h-9 space-y-1">
                <span class="block w-5 h-0.5 bg-white"></span>
                <span class="block w-5 h-0.5 bg-white"></span>
                <span class="block w-5 h-0.5 bg-white"></span>
              </button>
            </div>
          </div>

          <!-- Menú desplegable -->
          ${state.menuOpen ? `
            <div id="dropdownMenu" class="absolute top-full right-4 mt-2 w-64 bg-white rounded-xl shadow-2xl border border-slate-200 py-2 z-50 text-slate-800">
              <div class="px-4 py-2 border-b border-slate-100 sm:hidden">
                <p class="text-xs font-bold">${state.user.name}</p>
                <p class="text-[10px] text-slate-500 uppercase">${state.user.role === 'admin' ? 'Capacitador / Admin' : 'Estudiante'}</p>
              </div>
              <button onclick="setTab('muro')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'muro' ? 'text-emerald-700 bg-emerald-50' : ''}">💬 Muro Social</button>
              <button onclick="setTab('modulos')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'modulos' ? 'text-emerald-700 bg-emerald-50' : ''}">📚 Módulos y PDFs</button>
              <button onclick="setTab('ppt')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'ppt' ? 'text-red-700 bg-red-50' : ''}">📊 Clase PPT</button>
              <button onclick="setTab('tareas')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'tareas' ? 'text-emerald-700 bg-emerald-50' : ''}">📝 Tareas y Word</button>
              <button onclick="setTab('calificaciones')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'calificaciones' ? 'text-emerald-700 bg-emerald-50' : ''}">🏆 Calificaciones</button>
              <button onclick="setTab('preguntas')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'preguntas' ? 'text-emerald-700 bg-emerald-50' : ''}">❓ Preguntas</button>
              <button onclick="setTab('fototeca')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 ${state.activeTab === 'fototeca' ? 'text-emerald-700 bg-emerald-50' : ''}">📷 Fototeca</button>
              
              ${state.user.role === 'admin' ? `
                <button onclick="setTab('estudiantes')" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-slate-50 flex items-center space-x-2 border-t border-slate-100 ${state.activeTab === 'estudiantes' ? 'text-emerald-700 bg-emerald-50' : ''}">👥 Gestión de Grupo</button>
              ` : ''}

              <div class="border-t border-slate-100 mt-1 pt-1 sm:hidden">
                ${state.user.role === 'admin' ? `
                  <button onclick="resetSalonData()" class="w-full text-left px-4 py-2 text-xs font-semibold text-amber-600 hover:bg-amber-50">🔄 Resetear Salón</button>
                ` : ''}
                <button onclick="logout()" class="w-full text-left px-4 py-2 text-xs font-semibold text-red-600 hover:bg-red-50">🚪 Salir</button>
              </div>
            </div>
          ` : ''}
        </header>

        <!-- Contenido principal -->
        <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6">
          ${renderTabContent()}
        </main>

        <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs border-t border-slate-800 mt-auto">
          <p class="font-semibold text-slate-300">Capacitaciones ALR • Todos los derechos reservados</p>
        </footer>
      `;
    }

    function renderTabContent() {
      if (state.activeTab === 'estudiantes' && state.user.role === 'admin') {
        const studentsList = state.whitelist.filter(u => u.role === 'student');
        return `
          <div class="space-y-6">
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-5 shadow-sm">
              <h3 class="text-xs font-bold text-emerald-900 uppercase mb-3">➕ Registrar Nuevo Estudiante en la Nube</h3>
              <form onsubmit="addStudent(event)" class="space-y-3">
                <div class="grid gap-3 sm:grid-cols-3">
                  <input type="text" id="studentName" required placeholder="Nombre completo" class="p-2 border rounded text-xs bg-white">
                  <input type="email" id="studentEmail" required placeholder="Correo electrónico" class="p-2 border rounded text-xs bg-white">
                  <input type="text" id="studentCedula" required placeholder="Número de cédula" class="p-2 border rounded text-xs bg-white">
                </div>
                <div class="flex justify-end">
                  <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold shadow">Guardar en Base de Datos</button>
                </div>
              </form>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
              <h3 class="text-sm font-bold text-slate-900">Estudiantes Autorizados en Supabase</h3>
              ${studentsList.length === 0 ? '<p class="text-center text-xs text-slate-400 py-6">No hay estudiantes registrados.</p>' : `
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs text-slate-600">
                    <thead class="bg-slate-50 text-slate-700 uppercase text-[9px]">
                      <tr>
                        <th class="py-2.5 px-3">Nombre</th>
                        <th class="py-2.5 px-3">Correo</th>
                        <th class="py-2.5 px-3">Cédula</th>
                        <th class="py-2.5 px-3 text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${studentsList.map(st => `
                        <tr>
                          <td class="py-2.5 px-3 font-bold text-slate-800">${st.name}</td>
                          <td class="py-2.5 px-3">${st.email}</td>
                          <td class="py-2.5 px-3">${st.cedula}</td>
                          <td class="py-2.5 px-3 text-center">
                            <button onclick="deleteStudent('${st.email}')" class="text-red-600 hover:underline font-semibold">Eliminar</button>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'muro') {
        return `
          <div class="space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
              <h3 class="text-xs font-bold text-slate-800 uppercase mb-2">Crear nueva publicación</h3>
              <form onsubmit="addPost(event)">
                <textarea id="newPostText" rows="3" placeholder="¿Qué deseas compartir con tu salón?" class="w-full p-3 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>
                <div class="flex justify-end mt-2">
                  <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow">Publicar</button>
                </div>
              </form>
            </div>

            <div class="space-y-4">
              ${state.posts.length === 0 ? '<p class="text-center text-xs text-slate-400 py-8 bg-white rounded-xl border border-slate-200">No hay publicaciones en el muro todavía.</p>' : ''}
              ${state.posts.map(p => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="font-bold text-slate-900 text-xs">${p.author}</h4>
                      <span class="text-[10px] text-slate-400">${p.timestamp}</span>
                    </div>
                    ${state.user.role === 'admin' || p.author.includes(state.user.name) ? `<button onclick="deletePost(${p.id})" class="text-slate-400 hover:text-red-600 text-xs">🗑️</button>` : ''}
                  </div>
                  <p class="text-slate-700 text-xs">${p.content}</p>
                  <div class="flex items-center space-x-3 pt-2 border-t border-slate-100 text-xs">
                    <button onclick="likePost(${p.id})" class="text-emerald-600 font-semibold hover:underline">👍 ${p.likes} Me gusta</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'modulos') {
        return `
          <div class="space-y-6">
            ${state.user.role === 'admin' ? `
              <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-5 shadow-sm">
                <h3 class="text-xs font-bold text-emerald-900 uppercase mb-3">➕ Cargar Nuevo Módulo</h3>
                <form onsubmit="addModule(event)" class="space-y-3">
                  <div class="grid gap-3 sm:grid-cols-2">
                    <input type="text" id="modTitle" required placeholder="Título del Módulo" class="p-2 border rounded text-xs bg-white">
                    <input type="text" id="modCourse" required placeholder="Nombre del Programa" class="p-2 border rounded text-xs bg-white">
                  </div>
                  <textarea id="modDesc" rows="2" placeholder="Breve descripción..." class="w-full p-2 border rounded text-xs bg-white resize-none"></textarea>
                  <input type="text" id="modUrl" required placeholder="Enlace web del archivo" class="w-full p-2 border rounded text-xs bg-white">
                  <div class="flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold shadow">Cargar Módulo</button>
                  </div>
                </form>
              </div>
            ` : ''}

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
              <h3 class="text-sm font-bold text-slate-900">Módulos Académicos Oficiales</h3>
              ${state.modules.length === 0 ? '<p class="text-center text-xs text-slate-400 py-6">No hay módulos cargados.</p>' : `
                <div class="grid gap-4 sm:grid-cols-3">
                  ${state.modules.map(m => `
                    <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 flex flex-col justify-between relative">
                      ${state.user.role === 'admin' ? `<button onclick="deleteModule(${m.id})" class="absolute top-3 right-3 text-slate-400 hover:text-red-600 text-xs">🗑️</button>` : ''}
                      <div>
                        <span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 mb-2 inline-block">${m.course}</span>
                        <h4 class="font-bold text-slate-900 text-xs mb-1 pr-6">${m.title}</h4>
                        <p class="text-[11px] text-slate-600 mb-4">${m.desc}</p>
                      </div>
                      <a href="${m.url}" target="_blank" class="block text-center w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold">📄 Ver Módulo</a>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'ppt') {
        return `
          <div class="space-y-6">
            ${state.user.role === 'admin' ? `
              <div class="bg-red-50 border border-red-200 rounded-xl p-5 shadow-sm">
                <h3 class="text-xs font-bold text-red-900 uppercase mb-3">➕ Cargar Nueva Clase</h3>
                <form onsubmit="addPresentation(event)" class="space-y-3">
                  <div class="grid gap-3 sm:grid-cols-2">
                    <input type="text" id="pptTitle" required placeholder="Título de la Clase" class="p-2 border rounded text-xs bg-white">
                    <input type="text" id="pptCourse" required placeholder="Programa" class="p-2 border rounded text-xs bg-white">
                  </div>
                  <textarea id="pptDesc" rows="2" placeholder="Breve descripción..." class="w-full p-2 border rounded text-xs bg-white resize-none"></textarea>
                  <input type="text" id="pptUrl" required placeholder="Enlace web PPT" class="w-full p-2 border rounded text-xs bg-white">
                  <div class="flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-semibold shadow">Cargar Clase</button>
                  </div>
                </form>
              </div>
            ` : ''}

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
              <h3 class="text-sm font-bold text-slate-900">Presentaciones de Clase (PPT)</h3>
              ${state.presentations.length === 0 ? '<p class="text-center text-xs text-slate-400 py-6">No hay clases PPT cargadas.</p>' : `
                <div class="grid gap-4 sm:grid-cols-3">
                  ${state.presentations.map(ppt => `
                    <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 flex flex-col justify-between relative">
                      ${state.user.role === 'admin' ? `<button onclick="deletePresentation(${ppt.id})" class="absolute top-3 right-3 text-slate-400 hover:text-red-600 text-xs">🗑️</button>` : ''}
                      <div>
                        <span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-800 mb-2 inline-block">${ppt.course}</span>
                        <h4 class="font-bold text-slate-900 text-xs mb-1 pr-6">${ppt.title}</h4>
                        <p class="text-[11px] text-slate-600 mb-4">${ppt.desc}</p>
                      </div>
                      <a href="${ppt.url}" target="_blank" class="block text-center w-full py-1.5 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-semibold">📊 Ver Clase PPT</a>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'tareas') {
        return `
          <div class="space-y-6">
            ${state.user.role === 'admin' ? `
              <div class="bg-blue-50 border border-blue-200 rounded-xl p-5 shadow-sm">
                <h3 class="text-xs font-bold text-blue-900 uppercase mb-3">➕ Cargar Nueva Tarea</h3>
                <form onsubmit="addTask(event)" class="space-y-3">
                  <div class="grid gap-3 sm:grid-cols-2">
                    <input type="text" id="taskTitle" required placeholder="Título de la Tarea" class="p-2 border rounded text-xs bg-white">
                    <input type="text" id="taskDueDate" required placeholder="Fecha límite" class="p-2 border rounded text-xs bg-white">
                  </div>
                  <textarea id="taskDesc" rows="2" placeholder="Instrucciones..." class="w-full p-2 border rounded text-xs bg-white resize-none"></textarea>
                  <input type="text" id="taskUrl" required placeholder="Enlace web de la tarea" class="w-full p-2 border rounded text-xs bg-white">
                  <div class="flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold shadow">Cargar Tarea</button>
                  </div>
                </form>
              </div>
            ` : ''}

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <h3 class="text-sm font-bold text-slate-900 mb-1">Entregables y Tareas de Campo</h3>
              ${state.tasks.length === 0 ? '<p class="text-center text-xs text-slate-400 py-6">No hay tareas asignadas.</p>' : `
                <div class="space-y-4">
                  ${state.tasks.map(t => {
                    const myGrade = t.grades && t.grades[state.user.email] !== undefined ? t.grades[state.user.email] : null;
                    return `
                      <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 relative">
                        ${state.user.role === 'admin' ? `<button onclick="deleteTask(${t.id})" class="absolute top-3 right-3 text-slate-400 hover:text-red-600 text-xs">🗑️</button>` : ''}
                        <div>
                          <div class="flex items-center space-x-2">
                            <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${myGrade !== null ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${myGrade !== null ? 'Completada' : 'Pendiente'}</span>
                            <span class="text-[10px] text-slate-400">📅 Entrega: ${t.dueDate}</span>
                          </div>
                          <h4 class="font-bold text-slate-900 text-xs mt-1 pr-6">${t.title}</h4>
                          <p class="text-[11px] text-slate-600 mt-0.5">${t.desc || ''}</p>
                          ${myGrade !== null ? `<p class="text-[11px] text-emerald-600 font-bold mt-1">Calificación: ${myGrade} / 100 pts</p>` : ''}
                        </div>
                        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                          <a href="${t.url}" target="_blank" class="flex-1 sm:flex-none text-center px-3 py-1.5 bg-slate-800 text-white rounded text-xs font-semibold">📄 Ver Tarea</a>
                          <button onclick="submitTask(${t.id})" class="flex-1 sm:flex-none text-center px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-semibold">✅ Marcar Entregada</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'calificaciones') {
        const studentsList = state.whitelist.filter(u => u.role === 'student');
        return `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h3 class="text-sm font-bold text-slate-900">Registro de Calificaciones del Grupo</h3>
            ${state.tasks.length === 0 || studentsList.length === 0 ? '<p class="text-center text-xs text-slate-400 py-6">Aún no hay suficientes datos para mostrar.</p>' : `
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-600">
                  <thead class="bg-slate-50 text-slate-700 uppercase text-[9px]">
                    <tr>
                      <th class="py-2.5 px-3">Estudiante</th>
                      ${state.tasks.map(t => `<th class="py-2.5 px-3 text-center">${t.title.split(':')[0]}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${studentsList.map((st, idx) => {
                      const displayName = state.user.role === 'admin' ? st.name : (st.email === state.user.email ? `${st.name} (Tú)` : `Estudiante ${idx + 1}`);
                      const isMe = st.email === state.user.email;
                      return `
                        <tr class="${isMe && state.user.role !== 'admin' ? 'bg-emerald-50/50 font-semibold' : ''}">
                          <td class="py-2.5 px-3 font-bold text-slate-800">${displayName}</td>
                          ${state.tasks.map(t => {
                            const gradeVal = t.grades && t.grades[st.email] !== undefined && t.grades[st.email] !== null ? t.grades[st.email] : '-';
                            if (state.user.role === 'admin') {
                              return `
                                <td class="py-2.5 px-3 text-center">
                                  <input type="number" min="0" max="100" value="${gradeVal === '-' ? '' : gradeVal}" onchange="updateGradeAdmin(${t.id}, '${st.email}', this.value)" class="w-16 p-1 border rounded text-center text-xs bg-white font-bold text-emerald-600" placeholder="-">
                                </td>
                              `;
                            } else {
                              return `<td class="py-2.5 px-3 text-center font-bold text-emerald-600">${gradeVal}</td>`;
                            }
                          }).join('')}
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        `;
      }

      if (state.activeTab === 'preguntas') {
        return `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h3 class="text-sm font-bold text-slate-900">Preguntas Directas al Capacitador</h3>
            <form onsubmit="addQuestion(event)">
              <textarea id="newQText" rows="2" placeholder="Escribe tu consulta..." class="w-full p-2.5 border rounded text-xs focus:outline-none resize-none"></textarea>
              <div class="flex justify-end mt-2">
                <button type="submit" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-semibold">Enviar Consulta</button>
              </div>
            </form>
            <div class="space-y-3 pt-2">
              ${state.questions.length === 0 ? '<p class="text-center text-xs text-slate-400 py-6">No hay preguntas registradas.</p>' : `
                ${state.questions.map(q => `
                  <div class="border rounded-lg p-3 bg-slate-50 space-y-2 text-xs">
                    <div class="font-bold text-slate-800">Consulta de: ${q.student}</div>
                    <p class="bg-white p-2.5 rounded border">"${q.question}"</p>
                    ${q.answered ? `
                      <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded text-emerald-900">
                        <b>Respuesta Oficial:</b> ${q.answer}
                      </div>
                    ` : (state.user.role === 'admin' ? `
                      <div class="space-y-1 pt-1">
                        <input type="text" id="ans-${q.id}" placeholder="Escribe la respuesta..." class="w-full bg-white border rounded px-2 py-1 text-xs">
                        <button onclick="answerQuestion(${q.id})" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-semibold">Publicar Respuesta</button>
                      </div>
                    ` : '<span class="text-amber-600 font-semibold text-[11px]">Pendiente de respuesta</span>')}
                  </div>
                `).join('')}
              `}
            </div>
          </div>
        `;
      }

      if (state.activeTab === 'fototeca') {
        return `
          <form onsubmit="addPhoto(event)" class="bg-white border rounded-xl p-4 shadow-sm mb-6 space-y-2">
            <h4 class="font-bold text-slate-800 text-xs">Compartir nueva foto</h4>
            <div class="grid gap-2 sm:grid-cols-2">
              <input type="text" id="photoTitle" placeholder="Título" class="p-2 border rounded text-xs bg-white">
              <input type="text" id="photoUrl" placeholder="URL de imagen" class="p-2 border rounded text-xs bg-white">
            </div>
            <div class="flex justify-end">
              <button type="submit" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs font-semibold">Subir Foto</button>
            </div>
          </form>
          ${state.photos.length === 0 ? '<p class="text-center text-xs text-slate-400 py-8 bg-white rounded-xl border border-slate-200">No hay fotos todavía.</p>' : `
            <div class="grid gap-4 sm:grid-cols-2">
              ${state.photos.map(p => `
                <div class="border rounded-xl overflow-hidden bg-slate-50 shadow-sm">
                  <div class="h-36 bg-slate-200">
                    <img src="${p.url}" alt="${p.title}" class="w-full h-full object-cover">
                  </div>
                  <div class="p-3">
                    <h5 class="font-bold text-slate-800 text-xs mb-0.5">${p.title}</h5>
                    <p class="text-[10px] text-slate-500">Subido por: ${p.author}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      }
    }

    // Cargar la lista blanca al iniciar la aplicación para validar logins y roles desde Supabase
    loadWhitelist();
  </script>
</body>
</html>
